<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>OAuth callback</title></head>
<body>
<h1>OAuth callback</h1>
<p>Query string received:</p>
<pre id="q"></pre>
<script>
var s = window.location.search;
var out = s ? s : '(none)';
var p = new URLSearchParams(s);
var lines = [];
p.forEach(function(v,k){ lines.push(k + ' = ' + v); });
document.getElementById('q').textContent = out + (lines.length ? '\n\n' + lines.join('\n') : '');
</script>
</body>
</html>
